<!doctype html>
<html lang="en" data-theme="github" data-crt="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>christen@imagination</title>
    <meta name="description" content="Christen Jacquottet's portfolio as a working terminal: creative technologist in Dallas building AI, realtime voice and web AR." />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Cpath d='M8 11l6 5-6 5' stroke='%237ee787' stroke-width='3' fill='none'/%3E%3Crect x='16' y='20' width='9' height='3' fill='%23f0f6fc'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=VT323&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- The 3D desk mounts here on `exit`; nothing 3D loads until then. -->
    <div class="desk" id="desk" hidden></div>

    <div class="screen" id="screen">
      <main class="term" id="term">
        <div class="output" id="output" role="log" aria-live="polite" aria-label="Terminal output"></div>
        <div class="prompt-line" id="prompt-line"><span class="prompt" id="prompt"></span><span class="mirror" id="mirror" aria-hidden="true"></span><input id="input" class="input" type="text" aria-label="Type a command" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" /></div>
      </main>
      <div class="fx fx-scan" aria-hidden="true"></div>
      <div class="fx fx-vignette" aria-hidden="true"></div>
    </div>

    <p class="desk-hint" id="desk-hint" hidden>touch anything · the floppies are my work · click the screen to sit back down</p>
    <p class="credit" id="credit" hidden></p>
    <noscript>
      <p>This terminal needs JavaScript. The full portfolio is at <a href="https://christenjacquottet.com">christenjacquottet.com</a>.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
